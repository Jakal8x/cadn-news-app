name: Build CADN News APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto-Patch Manifest & Environment
      run: |
        # 1. Kich hoat AndroidX
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.nonTransitiveRClass=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

        # 2. Gan app_logo lam bieu tuong app tren dien thoai
        if [ -f "app/src/main/res/drawable/app_logo.png" ]; then
          sed -i 's/@mipmap\/ic_launcher/@drawable\/app_logo/g' app/src/main/AndroidManifest.xml
          sed -i 's/@drawable\/ic_placeholder/@drawable\/app_logo/g' app/src/main/AndroidManifest.xml
        else
          sed -i 's/@mipmap\/ic_launcher/@drawable\/ic_placeholder/g' app/src/main/AndroidManifest.xml
        fi
        sed -i '/android:roundIcon/d' app/src/main/AndroidManifest.xml

        # 3. Chap nhan giay phep Android SDK co san tren may ao Ubuntu
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CADN_News_Debug_APK
        path: "**/build/outputs/apk/debug/*.apk"
