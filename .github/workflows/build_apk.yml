```yaml
name: Build CADN News APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
    - name: Auto-Fix Folder Structure
      run: |
        # Kiem tra neu code bi nam trong thu muc con cadn_app thi dua ra ngoai goc
        if [ ! -f "build.gradle" ]; then
          SUBDIR=$(find . -maxdepth 2 -name "build.gradle" -not -path "./build.gradle" | head -n 1 | xargs dirname)
          if [ -n "$SUBDIR" ]; then
            echo "Phat hien project nam trong thu muc $SUBDIR, dang chuyen ra thu muc goc..."
            cp -rn $SUBDIR/* .
          fi
        fi
        yes | sdkmanager --licenses || true
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'
    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CADN_News_Debug_APK
        path: "**/build/outputs/apk/debug/*.apk"
